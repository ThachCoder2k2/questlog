    if (!stage || stage.querySelector(":scope > .mac-x")) return;
    const x = document.createElement("div");
    x.className = "mac-x"; x.setAttribute("role", "group"); x.setAttribute("aria-label", "Window");
    x.innerHTML = '<button type="button" class="mac-c" tabindex="-1" aria-label="Close" title="Close (esc)"></button>' +
      '<button type="button" class="mac-m" tabindex="-1" aria-label="Minimize" title="Minimize (M)"></button><span class="mac-z"></span>';
    x.querySelector(".mac-c").addEventListener("click", () => document.getElementById("kClose").click());
    x.querySelector(".mac-m").addEventListener("click", () => document.getElementById("kMode").click());
    stage.appendChild(x);
  };
  /* the card's own words for "done" become the Mac word; put back whenever another theme is on */
  const onToday = () => !document.body.classList.contains("tab-week") && !document.body.classList.contains("tab-learn");   // there "Undo" takes a done step back; elsewhere it undoes a claim or a pin
  const SWAPS = [[".mi .lbl", { "Clear": "Mark Done" }], [".dstat > span", { "Cleared": "Done" }], ["#kDone > span", { "Undo": "Mark Not Done" }, onToday]];
  const restore = () => document.querySelectorAll("[data-m0]").forEach(n => { if (n.textContent === n.dataset.m1) n.textContent = n.dataset.m0; delete n.dataset.m0; delete n.dataset.m1; });
  new MutationObserver(() => { if (document.documentElement.dataset.theme !== "mac") restore(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  THEME_EXT.mac = {
    sounds: true,
    words: { "Done": "Mark Done", "Not done yet": "Mark Not Done", "Pin for tomorrow": "Pin for Tomorrow" },
    decorate() {
      lights();
      SWAPS.forEach(([sel, map, when]) => document.querySelectorAll(sel).forEach(n => {
        const t = n.textContent;
        if (n.dataset.m0 !== undefined && t !== n.dataset.m1) { delete n.dataset.m0; delete n.dataset.m1; }   // the card wrote new text here
        if (n.dataset.m0 === undefined && map[t] !== undefined && (!when || when())) { n.dataset.m0 = t; n.dataset.m1 = map[t]; n.textContent = map[t]; }
      }));
      document.querySelectorAll(".tnum[data-v] > b").forEach(b => {   // "01" reads as "1 min"
        const v = b.parentNode.dataset.v, t = /^0\d$/.test(v) ? v.slice(1) : null;
        if (t !== null && b.textContent !== t) b.textContent = t;
      });
    },
  };
}

  /* ----- save your progress after every key or click: the app writes study.json ----- */
  {
    let last = "";
    const ref = (x) => { const y = Object.assign({}, x, { t: ST[x.track] ? ST[x.track].id : null }); delete y.track; return y; };
    const snap = () => ({ v: 1, day: wToday, pos: Object.fromEntries(ST.map(t => [t.id, [t.pos.m, t.pos.s]])),
      pins: SS.pins.map(ref), todays: SS.todays.map(ref), cards: SS.cards.map(ref), logs: SS.logs.map(ref), recallDays: SS.recallDays });
    const save = () => {
      if (!HAS_LEARN || !window.QL_DATA) return;   // the preview never writes
      let j; try { j = JSON.stringify(snap()); } catch (e) { return; }
      if (j === last) return; last = j; post({ action: "study", state: JSON.parse(j) });
    };
    ["keydown", "click"].forEach(ev => document.addEventListener(ev, () => setTimeout(save, 0), true));
    setTimeout(save, 0);   // a new day's roll-over is saved at once
  }
  // first selection: the first unfinished Main quest, like the game's cursor on the next objective
  const first = pickable.find(r => !r.done && r.it.type === "main") || pickable.find(r => !r.done) || pickable[0];
  if (first) select(first); else { fillPane(null); updateButtons(); }
  if (full) setFull(true, false);
  { const t0 = params.get("tab") || D.tab || (kind === "evening" && HAS_LEARN && !(STUDY0 && STUDY0.pins.length) ? "learn" : ""); if ((t0 === "week" && WEEK) || (t0 === "learn" && HAS_LEARN)) setTab(t0, false); }   // the 22:00 card opens on Study until the next lesson is pinned
  if (WEEK && DEMO && !window.QL_DATA) setTimeout(runDemo, 1200);

  /* start motion when the window is on screen */
  let started = false;
  const go = () => {
    if (started) return; started = true;
    goAt = performance.now();
    document.body.classList.add("go");
    const fillAll = () => {
      if (P && P.total) { setRing(wheel.outer, P.done / P.total); }
      if (wheel.inner) {
        const mains = rows.filter(r => r.it.type === "main");
        setRing(wheel.inner, mains.length ? mains.filter(r => r.done).length / mains.length : 0);
      }
      document.querySelectorAll(".xp .tr i").forEach(i => { i.style.width = i.dataset.w + "%"; });
      placeCursor();
    };
    requestAnimationFrame(fillAll);
    setTimeout(fillAll, 400);   // fallback if rAF is throttled
    setTimeout(() => { cursorReady = true; placeCursor(); arrive(); }, 900);
  };
  window.QL_GO = go;
  setTimeout(go, inApp ? 1500 : 50);

  /* keep the window height in sync with the content, and tell the host where the drag handle is */
  let lastH = 0, lastDrag = 0;
  let fitting = false, readySent = false;
  const report = (action) => {
    if (full) {   // the window is the whole screen: nothing to size, nothing to drag (but the host still waits for "ready")
      if (action === "ready" && !readySent) { readySent = true; post({ action: "ready", height: Math.ceil(cardEl.getBoundingClientRect().height) || 600 }); }
      if (lastDrag !== "full") { lastDrag = "full"; post({ action: "dragzone", height: 0 }); }
      placeCursor(); edge(); return;
    }
    if (!fitting && +ENV.maxHeight && Math.ceil(cardEl.getBoundingClientRect().height) > +ENV.maxHeight) {
      fitting = true; fitToScreen(); fitting = false;   // the wheel or the stamp appeared: keep the footer on screen
    }
    const h = window.QL_HOLD_H || Math.ceil(cardEl.getBoundingClientRect().height);   // QL_HOLD_H: the theme list is open, keep the window as it is
    if (h && h !== lastH) { lastH = h; post({ action, height: h }); }
    const dz = Math.ceil(hd.getBoundingClientRect().bottom - cardEl.getBoundingClientRect().top);
    const dy = Math.max(0, Math.floor(hd.getBoundingClientRect().top - cardEl.getBoundingClientRect().top));   // the band starts at the header: the tabs row above it is buttons, not a handle
    const cb = cardEl.getBoundingClientRect(), dzKey = dz + ":" + dy + ":" + Math.round(cb.left);
    if (dz && dzKey !== lastDrag) { lastDrag = dzKey; post({ action: "dragzone", height: dz, y0: dy, x0: Math.round(cb.left), x1: Math.round(cb.right) }); }
    if (detailRow || gOpen) positionDetail();
    placeCursor(); edge();
  };
  // Keep the pane from changing height as the cursor moves: size it for the tallest quest once.
  const lockPaneHeight = () => {
    if (!desc.isConnected || !pickable.length) return;
    let max = 0;
    const keep = sel;
    pickable.forEach(r => { fillPane(r); max = Math.max(max, dBody.offsetHeight); });
    dBody.style.minHeight = max + "px";
    if (keep) fillPane(keep);
  };
  // A tall card on a small screen: shrink the quest list so the footer stays visible.
  const fitToScreen = () => {
    const maxH = +ENV.maxHeight;
    if (full) { lists.style.maxHeight = ""; return; }
    if (!maxH || !lists.isConnected) return;
    lists.style.maxHeight = "";
    const over = Math.ceil(cardEl.getBoundingClientRect().height) - maxH;
    if (over > 0) lists.style.maxHeight = Math.max(140, lists.clientHeight - over) + "px";
  };
  lockPaneHeight();
  fitToScreen();
  setTimeout(() => report("ready"), 0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lockPaneHeight(); fitToScreen(); report("resize"); });
  if (window.ResizeObserver) new ResizeObserver(() => report("resize")).observe(cardEl);
  window.addEventListener("resize", () => report("resize"));   // the window grew or shrank for the side panel
})();
</script>
</body>
</html>
